# Local development only; supply a reachable trusted issuer for the app profile.
name: book-companion
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: book
      POSTGRES_USER: book
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
    ports:
    - 127.0.0.1:15432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U book -d book
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    ports:
    - 127.0.0.1:16379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
    ports:
    - 127.0.0.1:19092:19092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
      - CMD
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --list
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  application:
    profiles:
    - app
    build:
      context: .
      target: runtime-from-tested
    ports:
    - 127.0.0.1:8080:8080
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/book
      DB_USER: book
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_ISSUER: ${JWT_ISSUER:-http://identity-provider:8080/issuer}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-orders-api}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_AUTO_CREATE: 'true'
      RELAY_ENABLED: 'true'
      CONSUMER_ENABLED: 'true'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 20s
